<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATEL PRODUCTION - Local Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen flex flex-col p-6">

    <header class="max-w-[1600px] w-full mx-auto bg-[#0c101d] border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 mb-6 shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="h-10 w-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-lg">PP</div>
            <div>
                <h1 class="text-[10px] uppercase text-indigo-400 font-extrabold">PATEL PRODUCTION</h1>
                <h2 class="text-base font-black text-white">LOCAL TOURNAMENT CONTROLLER</h2>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-2">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="sync-status">CLOUD SYNC ACTIVE</span>
            </div>
            <button onclick="resetTournament()" class="px-3.5 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs uppercase rounded-xl transition-all">RESET ALL</button>
        </div>
    </header>

    <main class="max-w-[1600px] w-full mx-auto flex-grow space-y-6">
        <div class="bg-[#0c101d] border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold text-slate-400 uppercase">Current Round:</span>
                <span id="current-round-label" class="text-cyan-400 font-mono font-black text-base">1 / 10</span>
                <button onclick="nextRound()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold uppercase rounded-xl transition-all shadow-lg shadow-indigo-900/30">Next Round / Save</button>
                <button onclick="resetCurrentRound()" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold uppercase rounded-xl transition-all">Reset Current Round</button>
            </div>
            <div class="text-xs font-bold text-slate-400">
                Rule: <span class="text-amber-400 font-mono">Top 8 Placement Points (8th=1 to 1st=10) + Kills</span>
            </div>
        </div>

        <div id="teams-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    </main>

    <!-- TEAM EDIT MODAL -->
    <div id="edit-team-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-[#0c101d] border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-400"></i> Edit Team, Slot & Logo
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white">&times;</button>
            </div>
            
            <input type="hidden" id="edit-modal-index">

            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Slot Number</label>
                        <input type="number" id="edit-modal-slot" class="w-full bg-[#141b2d] border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Team Name</label>
                        <input type="text" id="edit-modal-name" class="w-full bg-[#141b2d] border border-slate-700 rounded-xl px-3 py-2 text-white font-medium focus:border-indigo-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Upload Logo (JPG, JPEG, PNG, etc.)</label>
                    <input type="file" id="edit-modal-file" accept="image/*" onchange="handleImageUpload(event)" class="w-full bg-[#141b2d] border border-slate-700 rounded-xl px-3 py-2 text-white text-xs file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                </div>

                <input type="hidden" id="edit-modal-logo-base64">

                <div class="flex items-center gap-3 p-3 bg-[#141b2d]/60 rounded-xl border border-slate-800">
                    <div class="h-12 w-12 rounded-lg bg-slate-900 border border-slate-700 overflow-hidden flex items-center justify-center flex-shrink-0">
                        <img id="edit-modal-logo-preview" src="" alt="Preview" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%23475569\' stroke-width=\'1.5\'><rect width=\'18\' height=\'18\' x=\'3\' y=\'3\' rx=\'4\'/><circle cx=\'12\' cy=\'10\' r=\'3\'/><path d=\'M6 18v-1a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v1\'/></svg>'" class="h-full w-full object-cover">
                    </div>
                    <div class="text-xs text-slate-400">Live Logo Preview</div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold uppercase rounded-xl transition-all">Cancel</button>
                <button onclick="saveTeamEdit()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold uppercase rounded-xl transition-all shadow-lg shadow-indigo-900/30">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIG (NEW PATEL PP) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBazKZaj3QsgaQHPJxYfs4LyirQ7wswH7I",
            authDomain: "new-patel-pp.firebaseapp.com",
            databaseURL: "https://new-patel-pp-default-rtdb.firebaseio.com",
            projectId: "new-patel-pp",
            storageBucket: "new-patel-pp.firebasestorage.app",
            messagingSenderId: "426501539228",
            appId: "1:426501539228:web:fcd8f65c992590a61fb459"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = db.ref('patel_tournament_state');

        const PLACEMENT_POINTS = { 1: 10, 2: 6, 3: 5, 4: 4, 5: 3, 6: 2, 7: 1, 8: 1 };
        const DEFAULT_LOGO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='1.5'><rect width='18' height='18' x='3' y='3' rx='4'/><circle cx='12' cy='10' r='3'/><path d='M6 18v-1a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v1'/></svg>";

        let tournamentData = {
            round: 1,
            eliminationSequence: [],
            teams: Array.from({length: 25}, (_, i) => ({
                slot: i + 1,
                team: `Team ${String.fromCharCode(65 + i)}`,
                logo: '',
                alive: 4,
                fin: 0,
                totalPts: 0
            }))
        };

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                tournamentData = data;
                document.getElementById('sync-status').textContent = "CLOUD SYNC ACTIVE";
                renderGrid();
            } else {
                saveData();
            }
        });

        function saveData() {
            dbRef.set(tournamentData);
        }

        function getRankings() {
            let ranks = new Array(tournamentData.teams.length).fill('-');
            let placePtsMap = new Array(tournamentData.teams.length).fill(0);
            let elimSeq = tournamentData.eliminationSequence || [];
            
            if (elimSeq.length === 0) return { ranks, placePtsMap };

            let eliminationRanks = {};
            elimSeq.forEach((teamIdx, index) => {
                let rank = tournamentData.teams.length - index;
                eliminationRanks[teamIdx] = rank;
            });

            tournamentData.teams.forEach((t, idx) => {
                if (eliminationRanks[idx] !== undefined) {
                    let r = eliminationRanks[idx];
                    ranks[idx] = r;
                    if (r <= 8) {
                        placePtsMap[idx] = PLACEMENT_POINTS[r] || 0;
                    }
                }
            });

            return { ranks, placePtsMap };
        }

        function renderGrid() {
            const grid = document.getElementById('teams-grid');
            grid.innerHTML = '';
            document.getElementById('current-round-label').textContent = `${tournamentData.round || 1} / 10`;

            const { ranks, placePtsMap } = getRankings();

            tournamentData.teams.forEach((t, idx) => {
                const slotNum = t.slot !== undefined ? t.slot : (idx + 1);
                const aliveVal = t.alive !== undefined ? t.alive : 4;
                const finVal = t.fin !== undefined ? t.fin : 0;
                const isAlive = aliveVal > 0;
                const rank = ranks[idx];
                const placePts = placePtsMap[idx];
                const roundPts = (rank === '-' || rank > 8) ? finVal : (placePts + finVal);
                const logoSrc = t.logo && t.logo.trim() !== '' ? t.logo : DEFAULT_LOGO;

                const card = document.createElement('div');
                card.className = "bg-[#0c101d] border border-slate-800 rounded-2xl p-4 flex flex-col justify-between shadow-lg";
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-mono font-black text-indigo-400 text-sm tracking-wider">SLOT ${String(slotNum).padStart(2,'0')}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="openEditModal(${idx})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold rounded-lg" title="Edit Slot, Logo & Name"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="toggleEliminate(${idx})" class="px-2.5 py-1 ${isAlive ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'} text-[10px] font-black uppercase rounded-lg">${isAlive ? 'ELIMINATE' : 'RESTORE'}</button>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2.5 mb-3 bg-[#141b2d] p-2 rounded-xl border border-slate-700/60">
                            <div class="h-8 w-8 rounded-lg bg-slate-950 overflow-hidden flex items-center justify-center flex-shrink-0 border border-slate-800">
                                <img src="${logoSrc}" onerror="this.src='${DEFAULT_LOGO}'" class="h-full w-full object-cover">
                            </div>
                            <span class="text-xs font-extrabold text-white truncate">${t.team}</span>
                        </div>
                        
                        <div class="space-y-2 mb-3">
                            <div class="bg-slate-950/60 p-2 rounded-xl border border-slate-800 flex items-center justify-between">
                                <span class="text-[10px] font-bold text-slate-400">ALIVE</span>
                                <div class="flex items-center bg-slate-900 rounded-lg overflow-hidden border border-slate-800">
                                    <button onclick="adjustAlive(${idx}, -1)" class="px-2 py-0.5 bg-slate-800 text-slate-300 font-bold">-</button>
                                    <span class="w-6 text-center font-black text-white text-xs">${aliveVal}</span>
                                    <button onclick="adjustAlive(${idx}, 1)" class="px-2 py-0.5 bg-slate-800 text-slate-300 font-bold">+</button>
                                </div>
                            </div>
                            <div class="bg-slate-950/60 p-2 rounded-xl border border-slate-800 flex items-center justify-between">
                                <span class="text-[10px] font-bold text-slate-400">KILLS (FIN)</span>
                                <div class="flex items-center bg-slate-900 rounded-lg overflow-hidden border border-slate-800">
                                    <button onclick="adjustFin(${idx}, -1)" class="px-2 py-0.5 bg-slate-800 text-slate-300 font-bold">-</button>
                                    <span class="w-6 text-center font-black text-cyan-400 text-xs">${finVal}</span>
                                    <button onclick="adjustFin(${idx}, 1)" class="px-2.5 py-0.5 bg-slate-800 text-slate-300 font-bold">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-1 bg-slate-950/40 p-2 rounded-xl border border-slate-800 text-center text-[10px] mb-2 font-mono">
                            <div><span class="text-slate-400 block">PLACE</span><span class="text-amber-400 font-bold">${rank}</span></div>
                            <div><span class="text-slate-400 block">RND PTS</span><span class="text-white font-bold">${roundPts}</span></div>
                            <div><span class="text-slate-400 block">TOT PTS</span><span class="text-indigo-400 font-bold">${t.totalPts || 0}</span></div>
                        </div>
                    </div>
                    <div class="text-[10px] font-bold text-slate-400 text-center pt-2 border-t border-slate-800">
                        Status: <span class="${isAlive ? 'text-emerald-400' : 'text-rose-400'}">${isAlive ? 'ALIVE' : 'ELIMINATED'}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openEditModal(index) {
            const t = tournamentData.teams[index];
            document.getElementById('edit-modal-index').value = index;
            document.getElementById('edit-modal-slot').value = t.slot !== undefined ? t.slot : (index + 1);
            document.getElementById('edit-modal-name').value = t.team;
            document.getElementById('edit-modal-file').value = "";
            document.getElementById('edit-modal-logo-base64').value = t.logo || '';
            document.getElementById('edit-modal-logo-preview').src = (t.logo && t.logo.trim() !== '') ? t.logo : DEFAULT_LOGO;
            document.getElementById('edit-team-modal').classList.remove('hidden');
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result;
                document.getElementById('edit-modal-logo-base64').value = base64String;
                document.getElementById('edit-modal-logo-preview').src = base64String;
            };
            reader.readAsDataURL(file);
        }

        function closeEditModal() { document.getElementById('edit-team-modal').classList.add('hidden'); }

        function saveTeamEdit() {
            const index = parseInt(document.getElementById('edit-modal-index').value);
            const newSlot = parseInt(document.getElementById('edit-modal-slot').value);
            
            tournamentData.teams[index].slot = isNaN(newSlot) ? (index + 1) : newSlot;
            tournamentData.teams[index].team = document.getElementById('edit-modal-name').value;
            tournamentData.teams[index].logo = document.getElementById('edit-modal-logo-base64').value;
            
            closeEditModal();
            saveData();
        }

        function adjustAlive(idx, delta) {
            let t = tournamentData.teams[idx];
            let oldAlive = t.alive !== undefined ? t.alive : 4;
            let newAlive = Math.max(0, Math.min(4, oldAlive + delta));
            if (oldAlive === newAlive) return;

            if(!tournamentData.eliminationSequence) tournamentData.eliminationSequence = [];

            t.alive = newAlive;
            if (oldAlive > 0 && newAlive === 0) {
                if (!tournamentData.eliminationSequence.includes(idx)) tournamentData.eliminationSequence.push(idx);
            } else if (oldAlive === 0 && newAlive > 0) {
                tournamentData.eliminationSequence = tournamentData.eliminationSequence.filter(i => i !== idx);
            }
            saveData();
        }

        function toggleEliminate(idx) {
            let t = tournamentData.teams[idx];
            let oldAlive = t.alive !== undefined ? t.alive : 4;
            let newAlive = oldAlive > 0 ? 0 : 4;

            if(!tournamentData.eliminationSequence) tournamentData.eliminationSequence = [];

            t.alive = newAlive;
            if (newAlive === 0) {
                if (!tournamentData.eliminationSequence.includes(idx)) tournamentData.eliminationSequence.push(idx);
            } else {
                tournamentData.eliminationSequence = tournamentData.eliminationSequence.filter(i => i !== idx);
            }
            saveData();
        }

        function adjustFin(idx, delta) {
            let t = tournamentData.teams[idx];
            t.fin = Math.max(0, (t.fin || 0) + delta);
            saveData();
        }

        function nextRound() {
            if (tournamentData.round < 10) {
                let elimSeq = tournamentData.eliminationSequence || [];
                let eliminationRanks = {};
                elimSeq.forEach((teamIdx, index) => {
                    eliminationRanks[teamIdx] = tournamentData.teams.length - index;
                });

                tournamentData.teams.forEach((t, idx) => {
                    let r = eliminationRanks[idx];
                    let placePts = (r !== undefined && r <= 8) ? (PLACEMENT_POINTS[r] || 0) : 0;
                    let kills = t.fin || 0;
                    t.totalPts = (t.totalPts || 0) + placePts + kills;
                    t.alive = 4;
                    t.fin = 0;
                    // Slot number wahi rahega jo set kiya hai, wo reset nahi hoga!
                });
                tournamentData.round++;
                tournamentData.eliminationSequence = [];
                saveData();
            } else {
                alert("Tournament has reached the final round (10/10).");
            }
        }

        function resetCurrentRound() {
            if (confirm("Reset Alive to 4 and Kills to 0 for this round?")) {
                tournamentData.teams.forEach(t => { t.alive = 4; t.fin = 0; });
                tournamentData.eliminationSequence = [];
                saveData();
            }
        }

        function resetTournament() {
            if (confirm("Are you sure you want to reset everything?")) {
                dbRef.remove().then(() => location.reload());
            }
        }
    </script>
</body>
</html>
